name: ALINA observer pilot tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic tests
        working-directory: alina_free_observer_v1
        run: python3 -m unittest -v
