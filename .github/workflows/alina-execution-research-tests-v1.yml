name: ALINA execution research tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Synthetic tests
        working-directory: alina_execution_research_v1
        run: python3 -m unittest -v
